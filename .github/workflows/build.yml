name: Build Boards

on:
  push:
    branches:
      - main
      - develop_vn   # <--- Thêm dòng này để nhận nhánh của cậu
      - ci/* # for ci test
  pull_request:
    branches:
      - main
      - develop_vn   # <--- Thêm dòng này luôn cho chắc
  workflow_dispatch: # <--- Thêm dòng này để hiện nút "Run workflow" thủ công
